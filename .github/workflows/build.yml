name: macOS Public Preview

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish draft prerelease from an existing release tag
        required: true
        type: boolean
        default: false
      release_tag:
        description: Existing v-prefixed semver tag (must match package.json)
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"

jobs:
  gate:
    name: Exact-commit release gate
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Resolve and validate release version
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" = "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${REQUESTED_TAG}"
          fi
          if [[ ! "$release_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag must use stable semver format vMAJOR.MINOR.PATCH"
            exit 1
          fi
          release_version="${release_tag#v}"
          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          if [[ "$release_version" != "$package_version" ]]; then
            echo "::error::Tag ${release_tag} does not match package.json version ${package_version}"
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${release_tag}^{commit}")"
          if [[ "$tag_commit" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag ${release_tag} does not point to workflow commit ${GITHUB_SHA}"
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"

      - name: Record release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          mkdir -p artifacts/release-logs
          git rev-parse HEAD | tee artifacts/release-logs/commit-sha.txt

      - name: Install dependencies from lockfile
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile 2>&1 | tee artifacts/release-logs/install.log

      - name: Check deprecated APIs
        shell: bash
        run: |
          set -euo pipefail
          bun run check:deprecated 2>&1 | tee artifacts/release-logs/check-deprecated.log

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          bun run lint 2>&1 | tee artifacts/release-logs/lint.log

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          bun run typecheck 2>&1 | tee artifacts/release-logs/typecheck.log

      - name: Run all tests
        shell: bash
        run: |
          set -euo pipefail
          bun run test:all 2>&1 | tee artifacts/release-logs/test-all.log

      - name: Run full verification
        shell: bash
        run: |
          set -euo pipefail
          bun run verify 2>&1 | tee artifacts/release-logs/verify.log

      - name: Run release verification
        shell: bash
        run: |
          set -euo pipefail
          bun run verify:release 2>&1 | tee artifacts/release-logs/verify-release.log
          cp artifacts/packaged-e2e/packaged-e2e-evidence.json artifacts/release-logs/gate-packaged-e2e-evidence.json

      - name: Check patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 2>&1 | tee artifacts/release-logs/git-diff-check.log

      - name: Confirm exact checkout stayed clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.release_tag }}-release-gate-logs
          path: artifacts/release-logs
          if-no-files-found: error
          retention-days: 30

  build:
    name: macOS ${{ matrix.arch }} package
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            artifact: mate-x-${{ needs.gate.outputs.release_tag }}-macos-x64
          - arch: arm64
            runner: macos-15
            artifact: mate-x-${{ needs.gate.outputs.release_tag }}-macos-arm64
    steps:
      - name: Checkout gated commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(uname -m)" = "${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Verify native dependencies load
        shell: bash
        run: |
          set -euo pipefail
          bun -e 'await import("@libsql/client"); await import("sharp"); await import("onnxruntime-node"); console.log(`native dependencies loaded on ${process.platform}/${process.arch}`)'

      - name: Qualify packaged application
        shell: bash
        run: |
          set -euo pipefail
          bun run verify:release

      - name: Build unsigned distributables
        shell: bash
        env:
          APPLE_ID: ""
          APPLE_ID_PASSWORD: ""
          APPLE_TEAM_ID: ""
        run: |
          set -euo pipefail
          bun run make -- --arch ${{ matrix.arch }}

      - name: Recheck ASAR purity and packaged E2E
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/release/verify-bundle-purity.ts --require-asar
          bun run scripts/release/run-packaged-e2e.ts

      - name: Stage artifacts and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          staging="artifacts/release/${{ matrix.arch }}"
          mkdir -p "$staging/files" "$staging/evidence"
          found=0
          while IFS= read -r -d '' file; do
            found=1
            cp "$file" "$staging/files/$(basename "$file")"
          done < <(find out/make -type f \( -name '*.dmg' -o -name '*.zip' \) -print0)
          test "$found" -eq 1
          (
            cd "$staging/files"
            for file in *; do
              shasum -a 256 "$file"
            done
          ) > "$staging/SHA256SUMS-${{ matrix.arch }}.txt"
          cp artifacts/packaged-e2e/packaged-e2e-evidence.json "$staging/evidence/packaged-e2e-${{ matrix.arch }}.json"
          printf '%s\n' "${GITHUB_SHA}" > "$staging/evidence/commit-sha.txt"
          printf '%s\n' "${{ matrix.arch }}" > "$staging/evidence/architecture.txt"

      - name: Upload qualified macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/release/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

  evidence:
    name: Aggregate release evidence
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download qualified artifacts and gate logs
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate exact-commit release evidence
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p final-evidence
          test_summary="$(grep -E '^[[:space:]]*[0-9]+ pass' "release-artifacts/${RELEASE_TAG}-release-gate-logs/test-all.log" | tail -1 | xargs || true)"
          test_failures="$(grep -E '^[[:space:]]*[0-9]+ fail' "release-artifacts/${RELEASE_TAG}-release-gate-logs/test-all.log" | tail -1 | xargs || true)"
          : "${test_summary:=See attached test-all.log}"
          : "${test_failures:=0 fail}"

          find release-artifacts -type f \( -name '*.dmg' -o -name '*.zip' \) -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                sha256sum "$file"
              done > final-evidence/SHA256SUMS.txt
          test -s final-evidence/SHA256SUMS.txt

          {
            echo "# MaTE X ${RELEASE_TAG} Release Evidence"
            echo
            echo '- Release: unsigned macOS Public Preview'
            echo "- Exact commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo '- Publication: disabled for this run; no tag or GitHub Release created'
            echo
            echo '## Required command results'
            echo
            echo '| Command | Result |'
            echo '| --- | --- |'
            echo '| `bun install --frozen-lockfile` | PASS |'
            echo '| `bun run check:deprecated` | PASS |'
            echo '| `bun run lint` | PASS |'
            echo '| `bun run typecheck` | PASS |'
            echo "| \`bun run test:all\` | PASS — ${test_summary}; ${test_failures} |"
            echo '| `bun run verify` | PASS |'
            echo '| `bun run verify:release` | PASS |'
            echo '| `git diff --check` | PASS |'
            echo
            echo '## Architecture qualification'
            echo
            echo '| Architecture | Native runner | Packaging | ASAR purity | Packaged E2E |'
            echo '| --- | --- | --- | --- | --- |'
            echo '| Intel x64 | `macos-15-intel` | PASS | PASS | PASS |'
            echo '| Apple Silicon arm64 | `macos-15` | PASS | PASS | PASS |'
            echo
            echo '## Artifacts and SHA-256'
            echo
            echo '```text'
            cat final-evidence/SHA256SUMS.txt
            echo '```'
            echo
            echo '## Unresolved risks'
            echo
            echo '- Artifacts are unsigned and not notarized because Apple credentials are unavailable.'
            echo '- Gatekeeper requires explicit user approval through Finder or System Settings.'
            echo '- Native silent auto-update remains disabled; updates open official GitHub Releases for manual download.'
            echo "- Windows and Linux are not ${RELEASE_TAG} public release targets."
          } > "final-evidence/${RELEASE_TAG}-release-evidence.md"

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: mate-x-${{ needs.gate.outputs.release_tag }}-release-evidence
          path: final-evidence
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish guarded draft prerelease
    needs: [gate, build, evidence]
    if: ${{ github.ref_type == 'tag' || inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require existing exact release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$tag_commit" = "${GITHUB_SHA}"

      - name: Download qualified artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish draft prerelease from existing tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.release_tag }}
          draft: true
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/mate-x-${{ needs.gate.outputs.release_tag }}-macos-x64/files/*
            release-artifacts/mate-x-${{ needs.gate.outputs.release_tag }}-macos-x64/SHA256SUMS-x64.txt
            release-artifacts/mate-x-${{ needs.gate.outputs.release_tag }}-macos-arm64/files/*
            release-artifacts/mate-x-${{ needs.gate.outputs.release_tag }}-macos-arm64/SHA256SUMS-arm64.txt
            release-artifacts/mate-x-${{ needs.gate.outputs.release_tag }}-release-evidence/*
